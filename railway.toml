[build]
builder = "NIXPACKS"

[phases.setup]
nixPkgs = ["openjdk21", "maven"]

[phases.build]
cmds = [
    # Create a persistent Maven cache
    "mkdir -p /cache/m2",
    "export MAVEN_OPTS='-Dmaven.repo.local=/cache/m2'",
    # Use system Maven instead of ./mvnw
    "mvn -B -DskipTests clean package -Pproduction",
    # Copy only final JAR to runtime folder
    "mkdir -p /app/runtime",
    "cp target/*.jar /app/runtime/app.jar"
]

[cache]
paths = ["/cache/m2"]

[start]
cmd = "java -Dserver.port=$PORT -jar /app/runtime/app.jar"
